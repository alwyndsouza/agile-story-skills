name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v1.2.0). Syncs metadata, then creates the tag if it does not exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '$tag' does not match v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Sync release metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          perl -0pi -e 's/"version":\s*"[^"]+"/"version": "$ENV{VERSION}"/' skills.json
          perl -0pi -e 's/version-[0-9]+\.[0-9]+\.[0-9]+-blue/version-$ENV{VERSION}-blue/g' README.md
          perl -0pi -e 's/gh release download v[0-9]+\.[0-9]+\.[0-9]+/gh release download $ENV{TAG}/g' README.md
          perl -0pi -e 's/agile-story-skills-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz/agile-story-skills-$ENV{VERSION}.tar.gz/g' README.md
          perl -0pi -e 's/cd agile-story-skills-[0-9]+\.[0-9]+\.[0-9]+/cd agile-story-skills-$ENV{VERSION}/g' README.md
          perl -0pi -e 's/version: "[0-9]+\.[0-9]+\.[0-9]+"/version: "$ENV{VERSION}"/g' .github/skills/*/SKILL.md
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            tmp="$(mktemp)"
            awk -v version="$VERSION" -v date="$(date -u +%F)" '
              !inserted && /^## \[/ {
                print "## [" version "] - " date
                print ""
                print "### Changed"
                print ""
                print "- Release metadata synchronized for `" version "`."
                print ""
                inserted = 1
              }
              { print }
            ' CHANGELOG.md > "$tmp"
            mv "$tmp" CHANGELOG.md
          fi

      - name: Commit release metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Release metadata already matches $TAG."
          else
            git add README.md skills.json CHANGELOG.md .github/skills/*/SKILL.md
            git commit -m "Sync release metadata for $TAG"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Create tag on manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping creation."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Strip leading/trailing blank lines
          sed -i -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' release-notes.md || true
          if [[ -s release-notes.md ]]; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No section for [$version] found in CHANGELOG.md — falling back to auto-generated notes."
            echo "source=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "❌ Release $tag already exists. Delete it first or pick a new tag."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if [[ "${{ steps.notes.outputs.source }}" == "changelog" ]]; then
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
