name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v1.1.0). Creates the tag if it does not exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '$tag' does not match v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create tag on manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping creation."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Strip leading/trailing blank lines
          sed -i -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' release-notes.md || true
          if [[ -s release-notes.md ]]; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No section for [$version] found in CHANGELOG.md — falling back to auto-generated notes."
            echo "source=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "❌ Release $tag already exists. Delete it first or pick a new tag."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if [[ "${{ steps.notes.outputs.source }}" == "changelog" ]]; then
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
