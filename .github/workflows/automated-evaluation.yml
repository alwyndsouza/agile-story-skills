name: Automated Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Specific skill to evaluate (leave blank for all)'
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/skills/**'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Evaluation Script
        run: |
          # In a production setup, you would provide API keys here
          # env:
          #   JUDGE_LLM_API_KEY: ${{ secrets.JUDGE_LLM_API_KEY }}
          python scripts/evaluate.py --skill "${{ github.event.inputs.skill }}"

      - name: Report Results
        run: echo "Evaluation complete. See logs for detailed scores."
