name: Automated Skill Evaluation

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Specific skill to evaluate (leave blank for all)'
        required: false
        default: ''
      model:
        description: 'Model to use as judge'
        required: false
        default: 'gpt-4o'
  pull_request:
    paths:
      - '.github/skills/**'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Evaluation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_ENDPOINT: "https://models.inference.ai.azure.com"
        run: |
          # The script will run in mock mode if keys are missing,
          # but will perform real evaluation if secrets are provided.
          python scripts/evaluate.py --skill "${{ github.event.inputs.skill }}" --model "${{ github.event.inputs.model || 'gpt-4o' }}"

      - name: Report Results
        run: echo "Evaluation complete. Scores below 4.0 will cause CI failure."
