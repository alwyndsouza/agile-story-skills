description: "Problem Framing — output quality eval"

# Model used to invoke the skill (candidate)
providers:
  - id: "{{env.EVAL_MODEL}}"
    config:
      temperature: 0

prompts:
  - file://prompts/problem-framing.yaml

# llm-rubric assertions use a separate grader call.
# Explicitly set it to Anthropic so we never fall back to the OpenAI default.
defaultTest:
  vars:
    skill_prompt: file://../.github/skills/problem-framing/SKILL.md
  options:
    provider: "{{env.EVAL_MODEL}}"

tests:
  # ── TC1: Non-interactive — infer and fill full canvas ─────────────────────
  - description: "TC1: Non-interactive — solution-first input reframed as symptom"
    vars:
      input: "Just frame this for me: We need a dashboard to monitor pipeline latency."
    assert:
      - type: contains
        value: "PROBLEM FRAMING CANVAS"
      - type: contains
        value: "PHASE 1 — LOOK INWARD"
      - type: contains
        value: "PHASE 2 — LOOK OUTWARD"
      - type: contains
        value: "PHASE 3 — REFRAME"
      - type: contains
        value: "How Might We:"
      - type: contains
        value: "Assumptions made"
      - type: llm-rubric
        value: >
          Q1 (Problem symptoms) describes an observable symptom such as
          "pipeline latency is not visible to the team" rather than restating
          the solution "we need a dashboard". Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          The problem statement follows the template: "The problem is: [who]
          struggles to [accomplish what] because [root cause], which leads to
          [consequence]." Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          The How Might We statement includes a measurable or directional
          objective (not vague language like "improve experience" or "make
          it better"). Answer PASS or FAIL.

  # ── TC2: Interactive start — must ask exactly one question ────────────────
  - description: "TC2: Interactive start — asks only Q1, no canvas yet"
    vars:
      input: "/problem-framing"
    assert:
      - type: not-contains
        value: "PROBLEM FRAMING CANVAS"
      - type: not-contains
        value: "PHASE 2"
      - type: llm-rubric
        value: >
          The response asks exactly one question — Q1 asking the user to
          describe the problem as symptoms. It does not ask multiple questions
          at once or skip ahead to Phase 2 or 3. Answer PASS or FAIL.

  # ── TC3: Context dump — pre-populates and asks for confirmation ───────────
  - description: "TC3: Context dump — pre-populates phase and asks for confirmation"
    vars:
      input: |
        Here's what we know. Frame it.

        Our data engineers spend 2 hours every Monday manually reconciling
        row counts between the source database and the data warehouse.
        The mismatch happens because the ETL job does not handle late-arriving
        records from the upstream API. Three times in the last quarter this
        caused the finance team to report incorrect weekly figures.
    assert:
      - type: contains
        value: "PHASE 1 — LOOK INWARD"
      - type: not-contains
        value: "PHASE 2 — LOOK OUTWARD"
      - type: not-contains
        value: "PHASE 3 — REFRAME"
      - type: not-contains
        value: "PROBLEM FRAMING CANVAS"
      - type: llm-rubric
        value: >
          The response pre-populates Phase 1 using details from the context
          dump (e.g. the 2-hour Monday reconciliation and late-arriving
          records) and asks the user to confirm or correct Phase 1 before
          moving on. Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          Fields inferred from the dump are marked "(inferred)" as required
          by the context-dump mode rules. Answer PASS or FAIL.

  # ── TC4: Natural language start — asks Q1 only ────────────────────────────
  - description: "TC4: Natural language start — asks Q1 only"
    vars:
      input: "We need to do problem framing."
    assert:
      - type: not-contains
        value: "PROBLEM FRAMING CANVAS"
      - type: llm-rubric
        value: >
          The response starts default interactive mode by asking only Q1 about
          observable symptoms, not solutions. Answer PASS or FAIL.

  # ── TC5: Non-interactive — finance reconciliation problem ─────────────────
  - description: "TC5: Non-interactive — finance reconciliation framing"
    vars:
      input: >
        Just frame this for me: Finance analysts spend two hours every Monday
        reconciling invoice totals because late-arriving records are missed by
        the daily ETL job.
    assert:
      - type: contains
        value: "PROBLEM FRAMING CANVAS"
      - type: contains
        value: "Assumptions made"
      - type: llm-rubric
        value: >
          The canvas names Finance analyst or finance analyst as an affected
          persona and describes the consequence of manual reconciliation.
          Answer PASS or FAIL.

  # ── TC6: Solution-first input — must convert to symptom ───────────────────
  - description: "TC6: Non-interactive — solution-first API request"
    vars:
      input: >
        Just frame this for me: We need to add a retry service for failed
        payment callbacks.
    assert:
      - type: contains
        value: "PROBLEM FRAMING CANVAS"
      - type: llm-rubric
        value: >
          The problem symptom is framed as failed payment callbacks or unreliable
          payment confirmation, not merely "we need a retry service". Answer PASS or FAIL.

  # ── TC7: HMW quality — must include measurable objective ──────────────────
  - description: "TC7: Non-interactive — measurable HMW"
    vars:
      input: >
        Just frame this for me: Operations teams learn about failed ingestion
        jobs from downstream dashboard complaints instead of alerts.
    assert:
      - type: contains
        value: "How Might We:"
      - type: llm-rubric
        value: >
          The How Might We statement includes an observable objective such as
          reducing missed failures, reducing complaint-driven detection, or
          improving detection time. Answer PASS or FAIL.

  # ── TC8: One canvas rule — avoid merging unrelated problems ───────────────
  - description: "TC8: Non-interactive — avoid merging unrelated problems"
    vars:
      input: >
        Just frame this for me: We need to reduce warehouse query costs, and
        we also need to improve onboarding email conversion.
    assert:
      - type: llm-rubric
        value: >
          The response does not silently merge the warehouse cost and onboarding
          email conversion problems into one broad HMW. It either chooses one
          canvas focus or flags that separate canvases are needed. Answer PASS or FAIL.
