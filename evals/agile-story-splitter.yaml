description: "Agile Story Splitter — output quality eval"

# Model used to invoke the skill (candidate)
providers:
  - id: "{{env.EVAL_MODEL}}"
    config:
      temperature: 0
      max_tokens: 8192

prompts:
  - file://prompts/agile-story-splitter.yaml

# llm-rubric assertions use a separate grader call.
# Keep the grader aligned to the configured EVAL_MODEL to avoid provider drift.
defaultTest:
  vars:
    skill_prompt: file://../.github/skills/agile-story-splitter/SKILL.md
  options:
    provider: "{{env.EVAL_MODEL}}"

tests:
  # ── TC1: Large story — should split into 2-5 vertical slices ─────────────
  - description: "TC1: 13-point story split — checkout migration"
    vars:
      input: |
        This story is too big, split it:

        TITLE:    Migrate full checkout flow to new payment gateway
        TYPE:     Story
        PRIORITY: High
        POINTS:   13

        As a finance analyst,
        I want the checkout flow to use the new payment gateway,
        So that transaction failures drop below 0.5% and PCI compliance is maintained.

        Scope IN: payment form, gateway API integration, error handling,
                  receipts, refunds, 3DS authentication
        Scope OUT: loyalty points, gift cards
    assert:
      - type: contains
        value: "SPLIT SUMMARY"
      - type: contains
        value: "INVEST VALIDATION"
      - type: contains
        value: "Pattern used:"
      - type: contains
        value: "╔══"
      - type: not-contains
        value: "as a user"
      - type: llm-rubric
        value: >
          The response produces between 2 and 5 sub-stories.
          Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          Every sub-story is a vertical slice that delivers standalone,
          user-visible value on its own. None of the slices are horizontal
          splits (e.g. "frontend story" / "backend story"). Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          Each sub-story has at least 2 acceptance criteria written in
          GIVEN/WHEN/THEN format. Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          Each sub-story carries a Fibonacci point estimate of 8 or fewer,
          with a one-line rationale. Answer PASS or FAIL.

  # ── TC2: Pattern-pinned — must use P1 Workflow Steps ─────────────────────
  - description: "TC2: Pattern-pinned — forced P1 Workflow Steps"
    vars:
      input: |
        Split this using workflow steps:

        TITLE:  Add expense report approval flow
        TYPE:   Story
        POINTS: 13

        As a finance analyst,
        I want to submit, track, and get approval for expense reports,
        So that reimbursements are processed within 5 business days.
    assert:
      - type: contains
        value: "╔══"
      - type: contains
        value: "SPLIT SUMMARY"
      - type: llm-rubric
        value: >
          The split uses Pattern P1 (Workflow Steps) as explicitly instructed.
          The SPLIT SUMMARY names "P1" or "Workflow Steps" as the pattern used.
          Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          The INVEST validation table flags the sequencing dependency (I column)
          for any story that depends on a sibling slice. Answer PASS or FAIL.

  # ── TC3: Anti-pattern — must refuse horizontal slice ─────────────────────
  - description: "TC3: Anti-pattern refusal — horizontal FE/BE split request"
    vars:
      input: |
        Split this story into a frontend story and a backend story:

        TITLE:  Build data quality dashboard
        TYPE:   Story
        POINTS: 8

        As a data engineer,
        I want a dashboard showing pipeline quality metrics,
        So that I can identify failing checks before they impact downstream consumers.
    assert:
      - type: not-contains
        value: "Frontend Story"
      - type: not-contains
        value: "Backend Story"
      - type: llm-rubric
        value: >
          The response refuses the horizontal FE/BE split, explaining that
          neither slice delivers standalone value. Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          The response offers a vertical slice alternative (e.g. a P1, P4,
          or P5 split) instead of the horizontal request. Answer PASS or FAIL.

  # ── TC4: Pattern-pinned — must use P2 Business Rule Variations ────────────
  - description: "TC4: Pattern-pinned — forced P2 Business Rule Variations"
    vars:
      input: |
        Split this using business rule variations:

        TITLE:  Calculate commission for sales orders
        TYPE:   Story
        POINTS: 13

        As a finance analyst,
        I want sales commission calculated for standard tiers, accelerators,
        clawbacks, and team overrides,
        So that monthly commission statements are ready before payroll cutoff.
    assert:
      - type: contains
        value: "SPLIT SUMMARY"
      - type: llm-rubric
        value: >
          The split uses Pattern P2 (Business rule variations) and each slice
          represents an independently valuable rule scenario. Answer PASS or FAIL.

  # ── TC5: Pattern-pinned — must use P3 Data Variations ─────────────────────
  - description: "TC5: Pattern-pinned — forced P3 Data Variations"
    vars:
      input: |
        Split this using data variations:

        TITLE:  Ingest partner sales feeds
        TYPE:   Story
        POINTS: 13

        As a data engineer,
        I want CSV, JSON, XML, and EDI partner feeds ingested into the warehouse,
        So that sales reporting covers all partner channels.
    assert:
      - type: contains
        value: "SPLIT SUMMARY"
      - type: llm-rubric
        value: >
          The split uses Pattern P3 (Data variations) and separates slices by
          data format, source group, or equivalent data variant. Answer PASS or FAIL.

  # ── TC6: Unknowns — must carve discovery with P8 ──────────────────────────
  - description: "TC6: Unknowns — P8 Tiny Acts of Discovery"
    vars:
      input: |
        This story is too big, split it:

        TITLE:  Migrate ML feature store to vendor platform
        TYPE:   Story
        POINTS: 13

        As an ML engineer,
        I want online feature reads served by the vendor feature platform,
        So that model inference stays reliable during traffic spikes.

        Unknown: production p95 read latency under shadow traffic.
    assert:
      - type: contains
        value: "SPLIT SUMMARY"
      - type: llm-rubric
        value: >
          The response uses Pattern P8 or includes a time-boxed Spike/Tiny Act
          of Discovery before delivery work. Answer PASS or FAIL.

  # ── TC7: Task split anti-pattern — must redirect to stories ───────────────
  - description: "TC7: Anti-pattern refusal — task split request"
    vars:
      input: |
        Split this into tasks: set up database, write API, add tests.

        TITLE:  Build invoice search
        TYPE:   Story
        POINTS: 8

        As a finance analyst,
        I want to search invoices by vendor and date,
        So that I can resolve payment questions without asking engineering.
    assert:
      - type: llm-rubric
        value: >
          The response refuses or redirects the task-only split because tasks
          do not deliver standalone persona value. Answer PASS or FAIL.
      - type: llm-rubric
        value: >
          The response proposes vertical story slices instead of separate
          database/API/test tasks. Answer PASS or FAIL.

  # ── TC8: Summary math — total estimate must be explicit ──────────────────
  - description: "TC8: Summary math — total estimate rationale"
    vars:
      input: |
        Break this epic into sprint-sized stories:

        TITLE:  Build customer 360 mart
        TYPE:   Story
        POINTS: 13

        As a business analyst,
        I want a curated customer 360 mart with identity, revenue, support,
        and product usage attributes,
        So that segmentation analysis can be run without manual joins.
    assert:
      - type: contains
        value: "Original estimate:"
      - type: contains
        value: "New total:"
      - type: llm-rubric
        value: >
          The split summary includes original estimate, new total, and a short
          explanation for why totals differ or stay the same. Answer PASS or FAIL.
